name: CI

on:
  pull_request:
    branches: [ master ]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.copilotignore'
      - '.gitignore'
      - '.gitattributes'
      - 'LICENSE'
  push:
    branches: [ master ]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
      - '.copilotignore'
      - '.gitignore'
      - '.gitattributes'
      - 'LICENSE'

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: backend
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: write
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-dotnet@v6
        with:
          # keeps SDK in sync with your repo
          global-json-file: ./global.json
      - name: Restore
        run: dotnet restore
      - name: .NET vulnerability scan
        # `dotnet list package --vulnerable` always exits 0, so fail explicitly on any reported advisory
        # except those suppressed (with justification) via <NuGetAuditSuppress> in Directory.Build.props.
        run: |
          dotnet list api.sln package --vulnerable --include-transitive 2>&1 | tee vulnerable.txt
          suppressed=$(grep -oE 'https://github.com/advisories/GHSA-[a-z0-9-]+' ../Directory.Build.props | sort -u || true)
          reported=$(grep -oE 'https://github.com/advisories/GHSA-[a-z0-9-]+' vulnerable.txt | sort -u || true)
          unsuppressed=$(comm -23 <(echo "$reported" | sed '/^$/d') <(echo "$suppressed" | sed '/^$/d'))
          if [ -n "$unsuppressed" ]; then
            echo "::error::Unsuppressed vulnerable NuGet packages detected:"
            echo "$unsuppressed"
            exit 1
          fi
      - name: Build
        run: dotnet build -c Release --no-restore -warnaserror
      - name: dotnet format check
        run: dotnet format api.sln --verify-no-changes --verbosity minimal
      - name: Set test environment
        run: echo "ASPNETCORE_ENVIRONMENT=Testing" >> $GITHUB_ENV
      - name: Test
        run: dotnet test -c Release --no-build --logger "trx;LogFileName=tests.trx"
      - name: Upload .NET test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: dotnet-tests
          # Path is repo-root relative; the test project lives at ./api.Tests (outside ./api)
          path: api.Tests/TestResults/**/*.trx

  frontend:
    name: frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: client-vite
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client-vite/package-lock.json
      - name: Install
        run: npm ci
      - name: npm audit
        run: npm audit --audit-level=high
      - name: Lint (strict)
        run: npm run lint:strict
      - name: Type check
        run: npm run typecheck
      - name: Format check
        run: npm run format
      - name: Test (Vitest)
        run: npm test -- --run
      - name: Build
        run: npm run build
      - name: Build Storybook
        run: npm run build-storybook
