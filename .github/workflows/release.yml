name: Release

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Optional version override (e.g. 1.0.0 or v1.0.0). Leave blank for automatic semver bump."
        required: false
        type: string
        default: ""

permissions:
  contents: write

concurrency:
  group: release-master
  cancel-in-progress: false

jobs:
  release:
    name: Auto Version & Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: refs/heads/master

      - name: Calculate next version tag (dry run)
        id: tag_calc
        uses: mathieudutour/github-tag-action@v7
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          default_bump: patch
          release_branches: master
          dry_run: true

      - name: Normalize release tag
        id: version
        if: inputs.version != '' || steps.tag_calc.outputs.new_tag != ''
        env:
          INPUT_VERSION: ${{ inputs.version }}
          RAW_TAG: ${{ steps.tag_calc.outputs.new_tag }}
        run: |
          SELECTED="${INPUT_VERSION:-$RAW_TAG}"
          SELECTED="$(printf '%s' "$SELECTED" | xargs)"
          CLEAN_VERSION="$(printf '%s' "$SELECTED" | sed -E 's/^[vV]+//')"
          if ! printf '%s' "$CLEAN_VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+([-.][0-9A-Za-z.]+)?$'; then
            echo "Invalid version '${SELECTED}'. Expected semver like 1.0.0 or v1.0.0." >&2
            exit 1
          fi
          echo "tag=v${CLEAN_VERSION}" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        if: steps.version.outputs.tag != ''
        uses: actions/setup-node@v7
        with:
          node-version: 24

      - name: Update CHANGELOG.md and commit
        if: steps.version.outputs.tag != ''
        env:
          NEW_TAG: ${{ steps.version.outputs.tag }}
          PREV_TAG: ${{ steps.tag_calc.outputs.previous_tag }}
        run: |
          node scripts/update-changelog.mjs --version "$NEW_TAG" --from "$PREV_TAG"
          if ! git diff --quiet CHANGELOG.md; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add CHANGELOG.md
            git commit -m "chore(release): update CHANGELOG.md for ${NEW_TAG} [skip ci]"
            git push origin HEAD:master
          fi

      - name: Create and push release tag
        if: steps.version.outputs.tag != ''
        env:
          RELEASE_TAG: ${{ steps.version.outputs.tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$RELEASE_TAG" -m "Release $RELEASE_TAG"
          git push origin "$RELEASE_TAG"

      - name: Setup .NET
        if: steps.version.outputs.tag != ''
        uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Build frontend into api/wwwroot
        if: steps.version.outputs.tag != ''
        working-directory: client-vite
        run: |
          npm ci
          npm run build

      - name: Publish self-contained Windows x64 bundle
        if: steps.version.outputs.tag != ''
        env:
          NEW_TAG: ${{ steps.version.outputs.tag }}
        run: |
          dotnet publish ./api/api.csproj -c Release -r win-x64 --self-contained true -o ./dist/win-x64
          cp Start-TCGTracker.ps1 Start-TCGTracker.bat ./dist/win-x64/
          rm -f ./dist/win-x64/*.db ./dist/win-x64/*.db-shm ./dist/win-x64/*.db-wal ./dist/win-x64/*.db-journal
          (cd ./dist/win-x64 && zip -r "../../TradingCardGameTracker-${NEW_TAG}-win-x64.zip" .)

      - name: Create GitHub Release
        if: steps.version.outputs.tag != ''
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Release ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          prerelease: false
          files: TradingCardGameTracker-${{ steps.version.outputs.tag }}-win-x64.zip
