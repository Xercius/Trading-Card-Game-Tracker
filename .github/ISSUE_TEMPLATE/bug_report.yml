name: Bug Report
description: Report a bug or unexpected behavior in the Trading Card Game Tracker.
title: "[Bug]: "
type: bug
projects: ["Xercius/2"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to report a bug! Please fill out the sections below so we can reproduce and fix the issue quickly.

  - type: dropdown
    id: severity
    attributes:
      label: Impact
      description: How much does this problem affect normal use?
      options:
        - Minor - Cosmetic or small inconvenience
        - Moderate - Feature works incorrectly but has a workaround
        - Major - Feature is unusable
        - Critical - Application is unusable or data may be lost
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of the application is affected?
      multiple: true
      options:
        - API/Backend
        - Client/Frontend
        - Card Details
        - Card Import
        - Collections
        - Decks
        - Wishlist
        - Admin
        - Values
        - Other
    validations:
      required: true

  - type: dropdown
    id: game
    attributes:
      label: Affected Game (if applicable)
      description: Is the bug specific to a trading card game?
      multiple: true
      options:
        - Magic the Gathering
        - Star Wars Unlimited
        - Pokémon TCG
        - Disney Lorcana
        - Flesh and Blood
        - Star Wars CCG
        - Hellbreak TCG
        - Guardians
        - Transformers TCG

  - type: textarea
    id: description
    attributes:
      label: Bug Description
      description: A clear and concise description of what the bug is.
      placeholder: "When I do X, Y happens instead of Z."
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected Behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: upload
    id: screenshots
    attributes:
      label: Screenshots
      description: If applicable, upload screenshots showing the problem.
    validations:
      required: false
