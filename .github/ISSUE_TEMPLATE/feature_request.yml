name: Feature Request
description: Suggest a new feature or improvement for the Trading Card Game Tracker.
title: "[Feature]: "
type: feature
projects: ["Xercius/2"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for suggesting a feature! Please fill out the details below so we can evaluate and plan the work.

  - type: dropdown
    id: area
    attributes:
      label: Area
      description: Which part of the application would this feature affect?
      options:
        - API/Backend
        - Client/Frontend
        - Card Details
        - Card Import
        - Collections
        - Decks
        - Wishlist
        - Admin
        - Values
        - New Game Support
        - Developer Experience
        - Other
    validations:
      required: true

  - type: dropdown
    id: game
    attributes:
      label: Affected Game (if applicable)
      description: Is the bug specific to a trading card game?
      multiple: true
      options:
        - Magic the Gathering
        - Star Wars Unlimited
        - Pokémon TCG
        - Disney Lorcana
        - Flesh and Blood
        - Star Wars CCG
        - Hellbreak TCG
        - Guardians
        - Transformers TCG
        - New Game

  - type: textarea
    id: problem
    attributes:
      label: Problem / Motivation
      description: What problem does this feature solve? Why is it needed?
      placeholder: "As a user, I want to ... so that I can ..."
    validations:
      required: true

  - type: textarea
    id: solution
    attributes:
      label: Proposed Solution
      description: Describe the feature you'd like to see implemented.
    validations:
      required: false

  - type: upload
    id: screenshots
    attributes:
      label: Screenshots
      description: If applicable, upload screenshots showing the problem.
    validations:
      required: false
